[project]
name = "pos"
version = "1.0.0"
description = "ПОС: преподавательская оценка студентов (КПО, ДЗ-2)"
requires-python = ">=3.10"
dependencies = ["punq>=0.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
exclude = [".venv", ".claude", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.coverage.report]
exclude_also = ["@abstractmethod"]
